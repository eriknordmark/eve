---
# FORK-ONLY: when a 9.9.* pre-release becomes a release, attach the
# maintainer's release approval (<tag>.maintainer.sigstore.json, one signed
# in-toto statement listing every image digest and sha256sums file) to each
# image as an OCI referrer, then check it the way a Docker Hub consumer
# would: fetch the referrer back and verify that the statement is signed by
# a maintainer and lists the image's digest.
name: Maintainer attach
on:  # yamllint disable-line rule:truthy
  release:
    types: [released]

permissions: {}

jobs:
  attach:
    if: github.repository == 'eriknordmark/eve' && startsWith(github.event.release.tag_name, '9.9.')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name }}
      BUNDLE_TYPE: application/vnd.dev.sigstore.bundle.v0.3+json
      APPROVAL: https://github.com/eriknordmark/eve/release-approval/v1
      MAINTAINERS: erik@zededa.com
      MAINTAINER_ISSUER: https://github.com/login/oauth
    steps:
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
        with:
          version: 1.3.1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir files
      - name: Attach and verify
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }
          bundle="files/$TAG.maintainer.sigstore.json"
          [ -f "$bundle" ] || die "no maintainer approval $bundle"
          approved() {
            local b=$1; shift
            for m in $MAINTAINERS; do
              cosign verify-blob-attestation --type "$APPROVAL" --certificate-identity "$m" \
                --certificate-oidc-issuer "$MAINTAINER_ISSUER" --bundle "$b" "$@" > /dev/null 2>&1 && return
            done
            return 1
          }
          jq -r '.dsseEnvelope.payload' "$bundle" | base64 -d |
            jq -e --arg t "$TAG" '.predicate.release == $t' > /dev/null || die "approval is not for $TAG"
          for sums in files/*.sha256sums; do
            approved "$bundle" "$sums" || die "$(basename "$sums") is not in the approval"
            echo "approved: $(basename "$sums")"
          done
          while read -r ref; do
            hex=${ref##*sha256:}
            approved "$bundle" --digest "$hex" --digestAlg sha256 || die "$ref is not in the approval"
            oras attach --artifact-type "$BUNDLE_TYPE" \
              --annotation dev.sigstore.bundle.content=dsse-envelope \
              --annotation "dev.sigstore.bundle.predicateType=$APPROVAL" \
              "$ref" "$bundle:$BUNDLE_TYPE"
          done < files/images.txt
          # What a Docker Hub consumer does: find the approval among the
          # image's referrers and verify it against the image's digest.
          while read -r ref; do
            hex=${ref##*sha256:}
            found=
            for m in $(oras discover --format json --artifact-type "$BUNDLE_TYPE" "$ref" |
                jq -r --arg p "$APPROVAL" '.. | objects
                  | select(.annotations?["dev.sigstore.bundle.predicateType"]? == $p) | .digest'); do
              layer=$(oras manifest fetch "${ref%@*}@$m" | jq -r '.layers[0].digest')
              oras blob fetch --output fetched.json "${ref%@*}@$layer"
              if approved fetched.json --digest "$hex" --digestAlg sha256; then found=$m; break; fi
            done
            [ -n "$found" ] || die "no maintainer approval among the referrers of $ref"
            echo "approved from the registry: $ref (referrer $found)"
            if cosign verify-attestation --type "$APPROVAL" --certificate-identity-regexp '.*' \
                --certificate-oidc-issuer "$MAINTAINER_ISSUER" "$ref" > /dev/null 2> err.txt; then
              echo "cosign verify-attestation also accepts it: $ref"
            else
              echo "::warning::cosign verify-attestation rejects it: $(tail -1 err.txt)"
            fi
          done < files/images.txt
