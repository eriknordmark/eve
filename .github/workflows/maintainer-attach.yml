---
# FORK-ONLY: when a 9.9.* pre-release becomes a release, attach the
# maintainer's image bundles (<hex>.maintainer.sigstore.json release assets)
# to their images as OCI referrers, the way cosign stores its own, and check
# that both the workflow and the maintainer signature verify.
name: Maintainer attach
on:  # yamllint disable-line rule:truthy
  release:
    types: [released]

permissions: {}

jobs:
  attach:
    if: github.repository == 'eriknordmark/eve' && startsWith(github.event.release.tag_name, '9.9.')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name }}
      BUNDLE_TYPE: application/vnd.dev.sigstore.bundle.v0.3+json
    steps:
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
        with:
          version: 1.3.1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir files
      - name: Attach and verify
        run: |
          set -euo pipefail
          while read -r ref; do
            b="files/${ref##*sha256:}.maintainer.sigstore.json"
            [ -f "$b" ] || { echo "::error::no maintainer bundle for $ref"; exit 1; }
            oras attach --artifact-type "$BUNDLE_TYPE" \
              --annotation dev.sigstore.bundle.content=dsse-envelope \
              --annotation dev.sigstore.bundle.predicateType=https://sigstore.dev/cosign/sign/v1 \
              "$ref" "$b:$BUNDLE_TYPE"
            cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity https://github.com/eriknordmark/eve/.github/workflows/release-sign.yml@refs/heads/sign-master \
              --certificate-github-workflow-repository eriknordmark/eve "$ref" > /dev/null
            echo "workflow signature verifies: $ref"
            cosign verify --certificate-oidc-issuer https://github.com/login/oauth \
              --certificate-identity-regexp '.*' "$ref" |
              jq -r --arg r "$ref" '.[] | "maintainer signature verifies: \($r) \(.optional.Subject // "")"'
          done < files/images.txt
