---
# FORK-ONLY: shows whether registry clients on this runner send Docker Hub
# credentials after docker/login-action, and which rate limit Docker Hub
# charges. Prints header names and rate-limit values only.
name: Docker Hub auth diagnostic
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - dockerhub-auth-diag

permissions: {}

jobs:
  diag:
    if: github.event.repository.full_name == 'eriknordmark/eve'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    permissions:
      contents: read
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Where the login went
        run: |
          echo "DOCKER_CONFIG=${DOCKER_CONFIG:-unset}"
          ls -la ~/.docker "${DOCKER_CONFIG:-/nonexistent}" 2>&1 || true
          docker info --format 'docker info registry user field: {{if .RegistryConfig}}present{{end}}'
      - name: go-containerregistry request (cosign tree)
        run: |
          for ref in docker.io/linuxkit/init:v1.3.0 docker.io/lfedge/eve-alpine:ef20bcb617db5545765f4d7486621cf606e5595e; do
            echo "== $ref"
            out=$(cosign tree --verbose "$ref" 2>&1 || true)
            echo "requests to index.docker.io: $(grep -c -- '--> [A-Z]* https://index.docker.io' <<< "$out")"
            echo "requests carrying Authorization: $(grep -c -i '^ *Authorization:' <<< "$out")"
            grep -i -E 'ratelimit|docker-ratelimit-source|<-- [0-9]{3} https://index.docker.io/v2/[^ ]*/manifests' <<< "$out" | sort | uniq -c | head -20
          done
      - name: docker CLI pull
        run: |
          docker pull -q docker.io/linuxkit/init:v1.3.0 || true
