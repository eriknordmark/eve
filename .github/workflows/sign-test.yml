---
# FORK-ONLY: exercises release-sign.yml without an EVE build. It pushes a
# small image and index to vars.DOCKERHUB_SIGN_NAMESPACE/eve-signtest and a
# blob, then hands them to release-sign.yml at the ref named in
# .github/sign-test-signer (default sign-master). With .github/sign-test-mode
# set to untagged, the image and index are pushed by digest only and tagged
# after release-sign.yml signed them.
name: Sign test
on:  # yamllint disable-line rule:truthy
  push:
    tags:
      - "9.9.*"

permissions: {}

jobs:
  build:
    if: github.repository == 'eriknordmark/eve'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      signer: ${{ steps.signer.outputs.signer }}
      mode: ${{ steps.signer.outputs.mode }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - id: signer
        run: |
          echo "signer=$(cat .github/sign-test-signer 2> /dev/null || echo sign-master)" >> "$GITHUB_OUTPUT"
          echo "mode=$(cat .github/sign-test-mode 2> /dev/null || echo tagged)" >> "$GITHUB_OUTPUT"
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
        with:
          version: 1.3.1
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
      - name: Push image, index and blob
        id: push
        env:
          REPO: docker.io/${{ vars.DOCKERHUB_SIGN_NAMESPACE }}/eve-signtest
          MODE: ${{ steps.signer.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p ctx out/images out/blobs
          printf '%s %s %s\n' "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_RUN_ID" > ctx/stamp
          printf 'FROM scratch\nCOPY stamp /stamp\n' > ctx/Dockerfile
          tag="$REPO:${GITHUB_REF_NAME}-${GITHUB_RUN_ID}"
          if [ "$MODE" = untagged ]; then
            docker buildx build --provenance=false --sbom=false --metadata-file meta.json \
              --output "type=image,name=$REPO,push-by-digest=true,name-canonical=true,push=true" ctx
            img="$REPO@$(jq -r '."containerimage.digest"' meta.json)"
            docker buildx imagetools create --dry-run "$img" > index.json
            idx="$REPO@$(oras manifest push --descriptor "$REPO" index.json | jq -r .digest)"
          else
            docker buildx build --provenance=false --sbom=false --push \
              --metadata-file meta.json -t "$tag-amd64" ctx
            img="$REPO@$(jq -r '."containerimage.digest"' meta.json)"
            docker buildx imagetools create -t "$tag" "$img"
            idx="$REPO@$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$tag" | jq -r .digest)"
          fi
          printf '%s\n%s\n' "$img" "$idx" | tee out/images/images.txt
          # No tag may point at either digest yet.
          if [ "$MODE" = untagged ]; then
            curl -fsS "https://hub.docker.com/v2/repositories/${REPO#docker.io/}/tags?page_size=100" |
              jq -r '.results[] | "\(.name) \(.digest) \([.images[]?.digest] | join(","))"' > tags.txt
            if grep -e "${img#*@}" -e "${idx#*@}" tags.txt; then
              echo "::error::a tag points at an unsigned digest"
              exit 1
            fi
            echo "untagged: $img $idx"
          fi
          cp ctx/stamp out/blobs/signtest.sha256sums
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: sign-images-signtest
          path: out/images
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: sign-blobs-signtest
          path: out/blobs

  sign-master:
    if: needs.build.outputs.signer == 'sign-master'
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: eriknordmark/eve/.github/workflows/release-sign.yml@sign-master
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
      registry-password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}

  sign-other:
    if: needs.build.outputs.signer == 'sign-other'
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: eriknordmark/eve/.github/workflows/release-sign.yml@sign-other
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
      registry-password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}

  tag:
    if: needs.build.outputs.mode == 'untagged'
    needs: [build, sign-master]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
        with:
          version: 1.3.1
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
      # Job outputs cannot carry the digests: GitHub drops an output that
      # contains a secret's value, and the namespace is the account name.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sign-images-signtest
          path: images
      - name: Tag the signed digests
        run: |
          tag="${GITHUB_REF_NAME}-${GITHUB_RUN_ID}"
          { read -r image; read -r index; } < images/images.txt
          oras tag "$image" "$tag-amd64"
          oras tag "$index" "$tag"

  # A pre-release carrying what a maintainer signs: the image list, the blob
  # and the workflow's bundle for it.
  release:
    if: needs.build.outputs.mode == 'untagged'
    needs: [build, tag]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: sign-*-signtest
          path: files
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: signed-blobs
          path: files
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l files
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "$GITHUB_REF_NAME" --notes "sign-test run $GITHUB_RUN_ID" files/*
