---
# FORK ONLY: rehearsal of the eve-alpine-base signing on eriknordmark/eve.
name: Alpine base image - build and publish on demand
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches: [rehearse-alpine-fix, rehearse-alpine-neg]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build and some tests clone from github.com (linuxkit, swtpm, ...).
  # GitHub throttles anonymous fetches per source IP, which makes those clones
  # fail in bursts on the shared self-hosted runners, so authenticate every
  # github.com clone this job makes.
  GITHUB_TOKEN: ${{ github.token }}
  GIT_ASKPASS: ${{ github.workspace }}/tools/github-askpass.sh
  EVE_COSIGN_ENFORCE: 'false'
  EVE_PKG_PREFIX: docker.io/eriknordmark
  EVE_COSIGN_IDENTITY_REGEXP: '^https://github\.com/eriknordmark/eve/\.github/workflows/build-alpine-base\.yml@refs/heads/rehearse-alpine-(fix|neg)$'
  EVE_COSIGN_REPOSITORY: eriknordmark/eve

jobs:
  # Step 1: Build alpine-base for each arch
  build-base:
    # Only run for the default branch
    if: github.event.repository.full_name == 'eriknordmark/eve'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Clear runner state
        run: |
          rm -rf ~/.linuxkit
          docker rm -f linuxkit-builder || :
          docker volume rm -f linuxkit-builder-state
          docker system prune --all --force --volumes
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute unique hash
        id: hash
        run: |
          CONTENT_HASH=$(make --no-print-directory -s alpine-base-show-tag | tail -1 | sed 's/.*://')
          GIT_REV=$(git rev-parse --short HEAD)
          HASH="${CONTENT_HASH}-${GIT_REV}"
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "Alpine-base hash: ${HASH}"
      - name: Set up QEMU for cross-arch builds
        if: matrix.arch == 'riscv64'
        run: |
          APT_INSTALL="sudo apt install -y binfmt-support qemu-user-static"
          $APT_INSTALL || { sudo apt update && $APT_INSTALL ; }
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
      # Forced through FORCE_BUILD: on a cross build the Makefile adds --pull
      # unless FORCE_BUILD is set, and linuxkit rejects --force with --pull.
      - name: Build and push alpine-base (${{ matrix.arch }})
        run: |
          make V=1 ZARCH=${{ matrix.arch }} LINUXKIT_PKG_TARGET=push \
            FORCE_BUILD=--force \
            LINUXKIT_EXTRA_BUILD_ARGS="--hash ${{ steps.hash.outputs.hash }}" \
            pkg/alpine-base
    outputs:
      hash: ${{ steps.hash.outputs.hash }}

  # Step 2: Create multi-arch manifest for alpine-base
  manifest-base:
    needs: build-base
    runs-on: ubuntu-24.04
    if: github.event.repository.full_name == 'eriknordmark/eve'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Clear runner state
        run: |
          rm -rf ~/.linuxkit
          docker rm -f linuxkit-builder || :
          docker volume rm -f linuxkit-builder-state
          docker system prune --all --force --volumes
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Create multi-arch manifest for alpine-base
        run: |
          echo "Creating manifest for alpine-base: ${{ needs.build-base.outputs.hash }}"
          make V=1 LINUXKIT_PKG_TARGET=manifest \
            \
            LINUXKIT_EXTRA_BUILD_ARGS="--hash ${{ needs.build-base.outputs.hash }}" \
            pkg/alpine-base
      - name: "FORK ONLY: install oras"
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
      - name: "FORK ONLY: a foreign push replaces the amd64 manifest before signing"
        env:
          HASH: ${{ needs.build-base.outputs.hash }}
        run: |
          echo "REHEARSAL_REF=docker.io/eriknordmark/eve-alpine-base:$HASH" >> "$GITHUB_ENV"
          REHEARSAL_REF="docker.io/eriknordmark/eve-alpine-base:$HASH" ./tools/rehearsal/plant.sh amd64
          REHEARSAL_REF="docker.io/eriknordmark/eve-alpine-base:$HASH" ./tools/rehearsal/check.sh F-plant unsigned slot amd64
      - name: Sign alpine-base
        env:
          HASH: ${{ needs.build-base.outputs.hash }}
        run: |
          ./tools/eve-cosign.sh sign-tags "eve-alpine-base:$HASH"
      - name: "FORK ONLY: check F"
        if: always()
        continue-on-error: true
        run: ./tools/rehearsal/check.sh F unsigned slot amd64
      - name: "FORK ONLY: check F-index"
        if: always()
        continue-on-error: true
        run: ./tools/rehearsal/check.sh F-index unsigned index
      - name: "FORK ONLY: check B-arm64"
        if: always()
        continue-on-error: true
        run: ./tools/rehearsal/check.sh B-arm64 signed slot arm64
