---
name: Alpine base image - build and publish on demand
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  # The build and some tests clone from github.com (linuxkit, swtpm, ...).
  # GitHub throttles anonymous fetches per source IP, which makes those clones
  # fail in bursts on the shared self-hosted runners, so authenticate every
  # github.com clone this job makes.
  GITHUB_TOKEN: ${{ github.token }}
  GIT_ASKPASS: ${{ github.workspace }}/tools/github-askpass.sh

jobs:
  # Step 1: Build alpine-base for each arch
  build-base:
    # Only run for the default branch
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: zededa-ubuntu-2204
          - arch: arm64
            runner: zededa-ubuntu-2204-arm64
          - arch: riscv64
            runner: zededa-ubuntu-2204
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Clear runner state
        run: |
          rm -rf ~/.linuxkit
          docker rm -f linuxkit-builder || :
          docker volume rm -f linuxkit-builder-state
          docker system prune --all --force --volumes
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute unique hash
        id: hash
        run: |
          CONTENT_HASH=$(make --no-print-directory -s alpine-base-show-tag | tail -1 | sed 's/.*://')
          GIT_REV=$(git rev-parse --short HEAD)
          HASH="${CONTENT_HASH}-${GIT_REV}"
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "Alpine-base hash: ${HASH}"
      - name: Set up QEMU for cross-arch builds
        if: matrix.arch == 'riscv64'
        run: |
          APT_INSTALL="sudo apt install -y binfmt-support qemu-user-static"
          $APT_INSTALL || { sudo apt update && $APT_INSTALL ; }
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.RELEASE_DOCKERHUB_ACCOUNT }}
          password: ${{ secrets.RELEASE_DOCKERHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.4
      # Forced through FORCE_BUILD: on a cross build the Makefile adds --pull
      # unless FORCE_BUILD is set, and linuxkit rejects --force with --pull.
      - name: Build alpine-base (${{ matrix.arch }})
        env:
          ARCH: ${{ matrix.arch }}
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          make V=1 ZARCH="$ARCH" LINUXKIT_PKG_TARGET=build \
            FORCE_BUILD=--force \
            LINUXKIT_EXTRA_BUILD_ARGS="--hash $HASH" \
            pkg/alpine-base
      - name: Verify the inputs of alpine-base
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ./tools/eve-cosign.sh check-inputs "$RUNNER_TEMP/base" "$ARCH" "$(docker version -f '{{.Server.Arch}}')"
      # Recorded before the push, so that a re-run can sign what this attempt
      # pushed even when it fails before signing.
      - name: Record the build
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: pkg-record-base-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/base
      # Without FORCE_BUILD, linuxkit pushes the build above from its cache.
      - name: Push alpine-base (${{ matrix.arch }})
        env:
          ARCH: ${{ matrix.arch }}
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          make V=1 ZARCH="$ARCH" LINUXKIT_PKG_TARGET=push \
            LINUXKIT_EXTRA_BUILD_ARGS="--hash $HASH" \
            pkg/alpine-base
      - name: Fetch every attempt's record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: pkg-record-base-${{ matrix.arch }}-*
          path: ${{ runner.temp }}/records-base
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Sign the build
        run: |
          ./tools/eve-cosign.sh sign-pushed "$RUNNER_TEMP/records-base"
    outputs:
      hash: ${{ steps.hash.outputs.hash }}

  # Step 2: Create multi-arch manifest for alpine-base
  manifest-base:
    needs: build-base
    runs-on: zededa-ubuntu-2204
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Clear runner state
        run: |
          rm -rf ~/.linuxkit
          docker rm -f linuxkit-builder || :
          docker volume rm -f linuxkit-builder-state
          docker system prune --all --force --volumes
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.RELEASE_DOCKERHUB_ACCOUNT }}
          password: ${{ secrets.RELEASE_DOCKERHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Create multi-arch manifest for alpine-base
        env:
          HASH: ${{ needs.build-base.outputs.hash }}
        run: |
          echo "Creating manifest for alpine-base: $HASH"
          make V=1 LINUXKIT_PKG_TARGET=manifest \
            LINUXKIT_EXTRA_BUILD_ARGS="--hash $HASH" \
            pkg/alpine-base
      - name: Fetch every job's records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: pkg-record-base-*
          path: ${{ runner.temp }}/records
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Sign the alpine-base index
        run: |
          ./tools/eve-cosign.sh sign-indexes "$RUNNER_TEMP/records"
      - name: Verify that alpine-base is signed
        run: |
          ./tools/eve-cosign.sh audit amd64 arm64 riscv64 -- "$RUNNER_TEMP/records"
