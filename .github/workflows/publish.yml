---
# FORK-ONLY rehearsal of the signed publish flow on eriknordmark/eve.
# Packages are pulled from docker.io/lfedge and never pushed; their
# signatures live in ghcr.io/eriknordmark (see sign-backfill.yml). EVE and
# eve-sources are built locally and pushed to ghcr.io/eriknordmark.
name: Publish
on:  # yamllint disable-line rule:truthy
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-lts"
      - "[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

permissions:
  contents: read

env:
  EVE_COSIGN_IDENTITY_REGEXP: '^https://github\.com/eriknordmark/eve/\.github/workflows/(publish|sign-backfill)\.yml@refs/(heads/(master|cosign-signing|[0-9]+\.[0-9]+(-stable)?)|tags/[0-9]+\.[0-9]+\.[0-9]+(-lts|-rc[0-9]+)?)$'
  EVE_COSIGN_REPOSITORY: eriknordmark/eve
  EVE_COSIGN_ENFORCE: 'true'
  EVE_SIG_PREFIX: ghcr.io/eriknordmark
  FORK_REGISTRY: ghcr.io/eriknordmark
  DOCKERHUB_PULL_USER: ${{ secrets.DOCKERHUB_PULL_USER }}

jobs:
  pkgs:
    if: github.event.repository.full_name == 'eriknordmark/eve'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, os: ubuntu-24.04}
          - {arch: arm64, os: ubuntu-24.04-arm}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - name: Force fetch annotated tags (workaround)
        run: |
          git fetch --force --tags
      - name: Login to Docker Hub
        if: env.DOCKERHUB_PULL_USER != ''
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_PULL_USER }}
          password: ${{ secrets.DOCKERHUB_PULL_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Build packages
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          SUCCESS=
          for i in 1 2 3; do
            echo "Run attempt: $i"
            if make -e V=1 HV=kvm ZARCH="$ARCH" PLATFORM=generic LINUXKIT_PKG_TARGET=build PRUNE=1 pkgs; then
              SUCCESS=true
              break
            else
              docker system prune -f -a --volumes
            fi
          done
          if [ -z "$SUCCESS" ]; then echo "::error::failed to build packages" && exit 1; fi
      - name: Verify package inputs
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ./tools/eve-cosign.sh classify "$RUNNER_TEMP/pkgs"
          ./tools/eve-cosign.sh verify "$RUNNER_TEMP/pkgs/pulled"
          ./tools/eve-cosign.sh verify-bases "$RUNNER_TEMP/pkgs/built" "$ARCH"
      - name: Require every package from the registry
        run: |
          if [ -s "$RUNNER_TEMP/pkgs/built" ]; then
            echo "::error::the fork cannot push or sign packages; built here:"
            cat "$RUNNER_TEMP/pkgs/built"
            exit 1
          fi
      - name: Post package report
        if: ${{ always() }}
        run: |
          df -h /
          docker system df

  eve:
    if: github.event.repository.full_name == 'eriknordmark/eve'
    needs: pkgs
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, hv: kvm, platform: generic, os: ubuntu-24.04}
          - {arch: arm64, hv: kvm, platform: generic, os: ubuntu-24.04-arm}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - name: Login to Docker Hub
        if: env.DOCKERHUB_PULL_USER != ''
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_PULL_USER }}
          password: ${{ secrets.DOCKERHUB_PULL_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Build remaining packages
        uses: ./.github/actions/run-make
        with:
          command: "V=1 HV=${{ matrix.hv }} ZARCH=${{ matrix.arch }} PLATFORM=${{ matrix.platform }} LINUXKIT_PKG_TARGET=build PRUNE=1 pkgs"
          dockerhub-token: ""
          dockerhub-account: ""
          clean: false
      - name: Verify package inputs
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ./tools/eve-cosign.sh classify "$RUNNER_TEMP/pkgs"
          ./tools/eve-cosign.sh verify "$RUNNER_TEMP/pkgs/pulled"
          ./tools/eve-cosign.sh verify-bases "$RUNNER_TEMP/pkgs/built" "$ARCH" "$(docker version -f '{{.Server.Arch}}')"
      # LINUXKIT_PKG_TARGET=push on a tag pushes every cached package to
      # lfedge, so the fork builds into docker and pushes EVE itself.
      - name: Build EVE
        uses: ./.github/actions/run-make
        with:
          command: "V=1 HV=${{ matrix.hv }} ZARCH=${{ matrix.arch }} PLATFORM=${{ matrix.platform }} LINUXKIT_PKG_TARGET=build eve"
          dockerhub-token: ""
          dockerhub-account: ""
          clean: false
      - name: Verify EVE inputs
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ./tools/eve-cosign.sh classify "$RUNNER_TEMP/eve"
          ./tools/eve-cosign.sh verify "$RUNNER_TEMP/eve/pulled"
          ./tools/eve-cosign.sh verify-bases "$RUNNER_TEMP/eve/built" "$ARCH" "$(docker version -f '{{.Server.Arch}}')"
          if [ -s "$RUNNER_TEMP/eve/built" ]; then
            echo "::error::the fork cannot push or sign packages; built here:"
            cat "$RUNNER_TEMP/eve/built"
            exit 1
          fi
      - name: Collect SBOM and sources
        uses: ./.github/actions/run-make
        with:
          command: "V=1 HV=${{ matrix.hv }} ZARCH=${{ matrix.arch }} PLATFORM=${{ matrix.platform }} LINUXKIT_PKG_TARGET=build sbom collected_sources compare_sbom_collected_sources publish_sources"
          dockerhub-token: ""
          dockerhub-account: ""
          clean: false
      - name: Push EVE and sources to GHCR
        env:
          ARCH: ${{ matrix.arch }}
          MAKE_VARS: "HV=${{ matrix.hv }} ZARCH=${{ matrix.arch }} PLATFORM=${{ matrix.platform }}"
          HV: ${{ matrix.hv }}
        run: |
          # shellcheck disable=SC2086
          VER=$(make -s $MAKE_VARS version | tail -1)
          # shellcheck disable=SC2086
          REL=$(make -s $MAKE_VARS LINUXKIT_PKG_TARGET=push eve_rel_info | tail -1)
          [ -n "$REL" ] || { echo "::error::no release name"; exit 1; }
          push() {
            docker tag "$1" "$2"
            docker push "$2"
          }
          push "lfedge/eve:$VER-$HV-$ARCH" "$FORK_REGISTRY/eve:$REL-$HV-$ARCH"
          if [ "$HV" = kvm ]; then
            push "lfedge/eve:$VER-$HV-$ARCH" "$FORK_REGISTRY/eve:$REL-$ARCH"
          fi
          push "lfedge/eve-sources:$VER-$HV-$ARCH" "$FORK_REGISTRY/eve-sources:$REL-$HV-$ARCH"
          echo "REL=$REL" >> "$GITHUB_ENV"
      - name: Sign release images
        env:
          ARCH: ${{ matrix.arch }}
          MAKE_VARS: "HV=${{ matrix.hv }} ZARCH=${{ matrix.arch }} PLATFORM=${{ matrix.platform }}"
          HV: ${{ matrix.hv }}
        run: |
          ./tools/eve-cosign.sh sign "$FORK_REGISTRY/eve:$REL-$HV-$ARCH"
          if [ "$HV" = kvm ]; then
            ./tools/eve-cosign.sh sign "$FORK_REGISTRY/eve:$REL-$ARCH"
          fi
          ./tools/eve-cosign.sh sign "$FORK_REGISTRY/eve-sources:$REL-$HV-$ARCH"
          # shellcheck disable=SC2086
          ./tools/eve-cosign.sh attest-sbom "$FORK_REGISTRY/eve:$REL-$HV-$ARCH" "$(make -s $MAKE_VARS sbom_info | tail -1)"
      - name: Post EVE report
        if: ${{ always() }}
        run: |
          df -h /
          docker system df

  # Upstream, linuxkit merges the per-arch pushes into these indexes; the fork
  # creates them here before signing them.
  sign-release:
    if: github.event.repository.full_name == 'eriknordmark/eve'
    needs: eve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Create release indexes
        run: |
          for suffix in "" -kvm; do
            docker buildx imagetools create -t "$FORK_REGISTRY/eve:${GITHUB_REF_NAME}${suffix}" \
              "$FORK_REGISTRY/eve:${GITHUB_REF_NAME}${suffix}-amd64" \
              "$FORK_REGISTRY/eve:${GITHUB_REF_NAME}${suffix}-arm64"
          done
      - name: Sign release indexes
        run: |
          for plat in "" -nvidia-jp5 -nvidia-jp6 -nvidia-jp7; do
            for hv in "" -kvm -xen -k -mini; do
              ref="$FORK_REGISTRY/eve:${GITHUB_REF_NAME}${plat}${hv}"
              if docker buildx imagetools inspect --raw "$ref" > /dev/null 2>&1; then
                ./tools/eve-cosign.sh sign "$ref"
              fi
            done
          done

  trigger_assets:
    if: github.event.repository.full_name == 'eriknordmark/eve'
    needs: [eve, sign-release]
    permissions:
      contents: write
      packages: read
      id-token: write
    uses: ./.github/workflows/assets.yml
    with:
      tag_ref: ${{ github.ref_name }}
