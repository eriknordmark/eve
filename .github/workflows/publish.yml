---
# FORK ONLY: publish.yml on eriknordmark/eve. lfedge packages are pulled;
# pkg/rehearsal is pushed and signed in docker.io/eriknordmark, and the
# FORK ONLY steps play an unsigned build pushing its tag, then check the
# outcome ("REHEARSAL CHECK").
name: Publish
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - "master"
      - "[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+-stable"
    paths-ignore:
      - '**/*.md'
      - '.github/**'
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-lts"
      - "[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

permissions:
  contents: read

env:
  # The build and some tests clone from github.com (linuxkit, swtpm, ...).
  # GitHub throttles anonymous fetches per source IP, which makes those clones
  # fail in bursts on the shared self-hosted runners, so authenticate every
  # github.com clone this job makes.
  GITHUB_TOKEN: ${{ github.token }}
  GIT_ASKPASS: ${{ github.workspace }}/tools/github-askpass.sh
  EVE_COSIGN_ENFORCE: 'false'
  EVE_PKG_PREFIX: docker.io/eriknordmark
  EVE_COSIGN_IDENTITY_REGEXP: '^https://github\.com/eriknordmark/eve/\.github/workflows/publish\.yml@refs/heads/[0-9]+\.[0-9]+$'
  EVE_COSIGN_REPOSITORY: eriknordmark/eve

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # Stage 1: Build and push base generic packages for each architecture.
  # Stage 2 EVE jobs pull these from the registry; `make pkgs` only
  # rebuilds any extra HV/platform-specific packages on top.
  # ════════════════════════════════════════════════════════════════════════

  # FORK ONLY: a build that does not sign, with the real linuxkit, pushes
  # pkg/rehearsal's tag before the run.
  plant-unsigned:
    if: github.event.repository.full_name == 'eriknordmark/eve'
    strategy:
      matrix:
        include:
          - {arch: amd64, os: ubuntu-24.04}
          - {arch: arm64, os: ubuntu-24.04-arm}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "FORK ONLY: log in to Docker Hub"
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: "FORK ONLY: install oras"
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
        with:
          version: 1.3.1
      - name: Push the tag unsigned
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          make V=1 ZARCH="$ARCH" LINUXKIT_PKG_TARGET=push FORCE_BUILD=--force pkg/rehearsal
      - name: "FORK ONLY: check U-plant"
        if: ${{ always() }}
        continue-on-error: true
        run: |
          ./tools/rehearsal/check.sh U-plant unsigned slot ${{ matrix.arch }}

  pkgs-amd64:
    if: github.event.repository.full_name == 'eriknordmark/eve'
    needs: plant-unsigned
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    timeout-minutes: 1440
    steps:
      - name: "FORK ONLY: free disk space"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - name: Clear runner state
        run: |
          rm -rf ~/.linuxkit
          docker rm -f linuxkit-builder || :
          docker volume rm -f linuxkit-builder-state
          docker system prune --all --force --volumes
      - name: Starting Report
        run: |
          echo Git Ref: ${{ github.ref }}
          echo GitHub Event: ${{ github.event_name }}
          echo Disk usage
          df -h
          echo Memory
          free -m
      # The tag fetch below runs against github.com, so the GITHUB_TOKEN must
      # stay in .git/config; anonymous git is subject to GitHub's rate limits.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - name: Force fetch annotated tags (workaround)
        run: |
          git fetch --force --tags
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Build packages
        run: |
          SUCCESS=
          for i in 1 2 3; do
            echo "Run attempt: $i"
            if make -e V=1 HV=kvm ZARCH=amd64 PLATFORM=generic LINUXKIT_PKG_TARGET=build PRUNE=1 pkgs; then
              SUCCESS=true
              break
            else
              docker system prune -f -a --volumes
            fi
          done
          if [ -z "$SUCCESS" ]; then echo "::error::failed to build packages" && exit 1; fi
      - name: Verify package inputs
        run: |
          ./tools/eve-cosign.sh check-inputs "$RUNNER_TEMP/pkgs" amd64
      # Recorded before the push, so that a re-run can sign what this attempt
      # pushed even when it fails before signing.
      - name: Record the packages built here
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: pkg-record-pkgs-amd64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkgs
      # A tag build has no package to push: it reuses what the branch build
      # pushed and signed, and rebuilds FORCE_BUILD_PKGS only into its own
      # EVE image. linuxkit would also add HEAD's git tag to every package
      # it pushes, pulling each reused one to do so.
      - name: Push packages
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          SUCCESS=
          for i in 1 2 3; do
            echo "Run attempt: $i"
            if make -e V=1 HV=kvm ZARCH=amd64 PLATFORM=generic LINUXKIT_PKG_TARGET=push PRUNE=1 PKGS=pkg/rehearsal pkgs; then
              SUCCESS=true
              break
            fi
          done
          if [ -z "$SUCCESS" ]; then echo "::error::failed to push packages" && exit 1; fi
      - name: Fetch every attempt's record
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: pkg-record-pkgs-amd64-*
          path: ${{ runner.temp }}/records-pkgs
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Sign the packages this job pushed
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          ./tools/eve-cosign.sh sign-pushed "$RUNNER_TEMP/records-pkgs"
      - name: "FORK ONLY: install oras"
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
        with:
          version: 1.3.1
      - name: "FORK ONLY: check U"
        if: ${{ always() }}
        continue-on-error: true
        run: |
          ./tools/rehearsal/check.sh U signed slot amd64
      - name: "FORK ONLY: check U-archtag"
        if: ${{ always() }}
        continue-on-error: true
        run: |
          ./tools/rehearsal/check.sh U-archtag signed archtag amd64
      - name: Post package report
        run: |
          echo Disk usage
          df -h
          echo Memory
          free -m
          docker system df
          docker system df -v
      - name: Clean
        if: ${{ always() }}
        run: |
          make clean
          docker system prune -f -a --volumes
          rm -rf ~/.linuxkit

  pkgs-arm64:
    if: github.event.repository.full_name == 'eriknordmark/eve'
    needs: plant-unsigned
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: read
      contents: read
      id-token: write
    timeout-minutes: 1440
    steps:
      - name: "FORK ONLY: free disk space"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - name: Clear runner state
        run: |
          rm -rf ~/.linuxkit
          docker rm -f linuxkit-builder || :
          docker volume rm -f linuxkit-builder-state
          docker system prune --all --force --volumes
      - name: Starting Report
        run: |
          echo Git Ref: ${{ github.ref }}
          echo GitHub Event: ${{ github.event_name }}
          echo Disk usage
          df -h
          echo Memory
          free -m
      # The tag fetch below runs against github.com, so the GITHUB_TOKEN must
      # stay in .git/config; anonymous git is subject to GitHub's rate limits.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - name: Force fetch annotated tags (workaround)
        run: |
          git fetch --force --tags
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Build packages
        run: |
          SUCCESS=
          for i in 1 2 3; do
            echo "Run attempt: $i"
            if make -e V=1 HV=kvm ZARCH=arm64 PLATFORM=generic LINUXKIT_PKG_TARGET=build PRUNE=1 pkgs; then
              SUCCESS=true
              break
            else
              docker system prune -f -a --volumes
            fi
          done
          if [ -z "$SUCCESS" ]; then echo "::error::failed to build packages" && exit 1; fi
      - name: Verify package inputs
        run: |
          ./tools/eve-cosign.sh check-inputs "$RUNNER_TEMP/pkgs" arm64
      - name: Record the packages built here
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: pkg-record-pkgs-arm64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkgs
      # See pkgs-amd64.
      - name: Push packages
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          SUCCESS=
          for i in 1 2 3; do
            echo "Run attempt: $i"
            if make -e V=1 HV=kvm ZARCH=arm64 PLATFORM=generic LINUXKIT_PKG_TARGET=push PRUNE=1 PKGS=pkg/rehearsal pkgs; then
              SUCCESS=true
              break
            fi
          done
          if [ -z "$SUCCESS" ]; then echo "::error::failed to push packages" && exit 1; fi
      - name: Fetch every attempt's record
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: pkg-record-pkgs-arm64-*
          path: ${{ runner.temp }}/records-pkgs
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Sign the packages this job pushed
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          ./tools/eve-cosign.sh sign-pushed "$RUNNER_TEMP/records-pkgs"
      - name: "FORK ONLY: install oras"
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
        with:
          version: 1.3.1
      - name: "FORK ONLY: check U"
        if: ${{ always() }}
        continue-on-error: true
        run: |
          ./tools/rehearsal/check.sh U signed slot arm64
      - name: "FORK ONLY: check U-archtag"
        if: ${{ always() }}
        continue-on-error: true
        run: |
          ./tools/rehearsal/check.sh U-archtag signed archtag arm64
      - name: Post package report
        run: |
          echo Disk usage
          df -h
          echo Memory
          free -m
          docker system df
          docker system df -v
      - name: Clean
        if: ${{ always() }}
        run: |
          make clean
          docker system prune -f -a --volumes
          rm -rf ~/.linuxkit

  # ════════════════════════════════════════════════════════════════════════
  # Stage 2: Build and push EVE images for every variant.
  # Base generic packages are already in the registry from Stage 1.
  # Each job builds any remaining HV/platform-specific packages (a fast
  # delta), pushes them, then builds and pushes the EVE image.
  # ════════════════════════════════════════════════════════════════════════

  eve:
    if: github.event.repository.full_name == 'eriknordmark/eve'
    needs: [pkgs-amd64, pkgs-arm64]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
      id-token: write
    timeout-minutes: 1440
    # run-make passes these to make -e. A branch build of a release's commit
    # would otherwise take the release's version from its tag and push EVE
    # under the release's names, which a tag build would then pull rather
    # than build.
    env:
      REPO_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'snapshot' }}
      FORCE_BUILD_EVE: ${{ startsWith(github.ref, 'refs/tags/') && '--force' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, hv: kvm, platform: generic, os: ubuntu-24.04}

    steps:
      - name: "FORK ONLY: free disk space"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - name: Clear runner state
        run: |
          rm -rf ~/.linuxkit
          docker rm -f linuxkit-builder || :
          docker volume rm -f linuxkit-builder-state
          docker system prune --all --force --volumes
      # run-make fetches tags from github.com, so the GITHUB_TOKEN must stay
      # in .git/config; anonymous git is subject to GitHub's rate limits.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - name: Install qemu for cross-arch build
        if: matrix.arch == 'riscv64'
        run: |
          APT_INSTALL="sudo apt install -y binfmt-support qemu-user-static"
          $APT_INSTALL || { sudo apt update && $APT_INSTALL ; }
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: "FORK ONLY: log in to Docker Hub"
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
      - name: Build remaining packages
        uses: ./.github/actions/run-make
        with:
          command: "V=1 HV=${{ matrix.hv }} ZARCH=${{ matrix.arch }} PLATFORM=${{ matrix.platform }} LINUXKIT_PKG_TARGET=build PRUNE=1 pkgs"
          dockerhub-token: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
          dockerhub-account: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          clean: false
      - name: Verify package inputs
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ./tools/eve-cosign.sh check-inputs "$RUNNER_TEMP/pkgs" "$ARCH" "$(docker version -f '{{.Server.Arch}}')"
      - name: Record the packages built here
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: pkg-record-eve-${{ matrix.arch }}-${{ matrix.hv }}-${{ matrix.platform }}-pkgs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkgs
      # See pkgs-amd64.
      - name: Push remaining packages
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: ./.github/actions/run-make
        with:
          command: "V=1 HV=${{ matrix.hv }} ZARCH=${{ matrix.arch }} PLATFORM=${{ matrix.platform }} LINUXKIT_PKG_TARGET=push PRUNE=1 PKGS=pkg/rehearsal pkgs"
          dockerhub-token: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
          dockerhub-account: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          clean: false
      - name: Fetch every attempt's record
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: pkg-record-eve-${{ matrix.arch }}-${{ matrix.hv }}-${{ matrix.platform }}-pkgs-*
          path: ${{ runner.temp }}/records-pkgs
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Sign the packages this job pushed
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          ./tools/eve-cosign.sh sign-pushed "$RUNNER_TEMP/records-pkgs"
      - name: "FORK ONLY: install oras"
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
        with:
          version: 1.3.1
      - name: "FORK ONLY: an unsigned build pushes the tag after this run signed it"
        run: |
          ./tools/rehearsal/plant.sh amd64
      - name: "FORK ONLY: check R-plant"
        if: ${{ always() }}
        continue-on-error: true
        run: |
          ./tools/rehearsal/check.sh R-plant unsigned slot amd64
      - name: "FORK ONLY: check R"
        if: ${{ always() }}
        continue-on-error: true
        run: |
          ./tools/rehearsal/check.sh R signed slot amd64
      - name: "FORK ONLY: check R-archtag"
        if: ${{ always() }}
        continue-on-error: true
        run: |
          ./tools/rehearsal/check.sh R-archtag signed archtag amd64
      - name: Build EVE
        uses: ./.github/actions/run-make
        with:
          command: "V=1 HV=${{ matrix.hv }} ZARCH=${{ matrix.arch }} PLATFORM=${{ matrix.platform }} LINUXKIT_PKG_TARGET=build eve"
          dockerhub-token: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
          dockerhub-account: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          clean: false
      - name: Verify EVE inputs
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ./tools/eve-cosign.sh check-inputs "$RUNNER_TEMP/eve" "$ARCH" "$(docker version -f '{{.Server.Arch}}')"
      - name: Record the packages the EVE build built
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: pkg-record-eve-${{ matrix.arch }}-${{ matrix.hv }}-${{ matrix.platform }}-eve-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eve
      # A release is pushed by digest in "Push the release for signing", and
      # tagged only after release-sign.yml has signed it.
      - name: Push EVE
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: ./.github/actions/run-make
        with:
          command: "V=1 HV=${{ matrix.hv }} ZARCH=${{ matrix.arch }} PLATFORM=${{ matrix.platform }} LINUXKIT_PKG_TARGET=push eve"
          dockerhub-token: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
          dockerhub-account: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          clean: false
      - name: Fetch every attempt's record of the EVE build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: pkg-record-eve-${{ matrix.arch }}-${{ matrix.hv }}-${{ matrix.platform }}-eve-*
          path: ${{ runner.temp }}/records-eve
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Sign the packages the EVE build pushed
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          ./tools/eve-cosign.sh sign-pushed "$RUNNER_TEMP/records-eve"
      - name: Collect and push SBOM and sources
        uses: ./.github/actions/run-make
        if: matrix.arch != 'riscv64'
        with:
          command: "V=1 HV=${{ matrix.hv }} ZARCH=${{ matrix.arch }} PLATFORM=${{ matrix.platform }} LINUXKIT_PKG_TARGET=${{ startsWith(github.ref, 'refs/tags/') && 'build' || 'push' }} sbom collected_sources compare_sbom_collected_sources publish_sources"
          dockerhub-token: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
          dockerhub-account: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          clean: false
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          version: 1.3.1
      - name: Push the release for signing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ZARCH: ${{ matrix.arch }}
          HV: ${{ matrix.hv }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          ./tools/eve-push-release.sh docker.io/lfedge sign
      - name: Hand the release images to release-sign.yml
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: sign-images-eve-${{ matrix.arch }}-${{ matrix.hv }}-${{ matrix.platform }}
          path: sign
      - name: Clean
        if: ${{ always() }}
        run: |
          make clean
          docker system prune -f -a --volumes
          rm -rf ~/.linuxkit

  # ════════════════════════════════════════════════════════════════════════
  # Stage 3: Multi-arch manifests and release assets.
  # Runs after all EVE jobs so every package image has been pushed.
  # ════════════════════════════════════════════════════════════════════════

  manifest:
    if: github.event.repository.full_name == 'eriknordmark/eve'
    needs: eve
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Clear runner state
        run: |
          rm -rf ~/.linuxkit
          docker rm -f linuxkit-builder || :
          docker volume rm -f linuxkit-builder-state
          docker system prune --all --force --volumes
      # run-make fetches tags from github.com, so the GITHUB_TOKEN must stay
      # in .git/config; anonymous git is subject to GitHub's rate limits.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - uses: ./.github/actions/run-make
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          command: "V=1 LINUXKIT_PKG_TARGET=manifest PKGS=pkg/rehearsal pkgs"
          dockerhub-token: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
          dockerhub-account: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
      - name: Fetch every job's records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: pkg-record-*
          path: ${{ runner.temp }}/records
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.4
      # make above pushed every package's index, listing every arch pushed.
      - name: "FORK ONLY: install oras"
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
        with:
          version: 1.3.1
      - name: "FORK ONLY: another signing run pushes the tag and signs it 90 s later"
        run: |
          PLANT_OUT="$RUNNER_TEMP/p3" ./tools/rehearsal/plant.sh amd64
          nohup bash -c "sleep 90; cosign sign --yes $(cat "$RUNNER_TEMP/p3")" > "$RUNNER_TEMP/p3-sign.log" 2>&1 &
      - name: Sign package indexes
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          ./tools/eve-cosign.sh sign-indexes "$RUNNER_TEMP/records"
      - name: Verify that every package the run pushed or used is signed
        run: |
          ./tools/eve-cosign.sh audit amd64 arm64 riscv64 -- "$RUNNER_TEMP/records"
      - name: "FORK ONLY: check W"
        if: ${{ always() }}
        continue-on-error: true
        run: |
          ./tools/rehearsal/check.sh W signed index
      - name: "FORK ONLY: check final-amd64"
        if: ${{ always() }}
        continue-on-error: true
        run: |
          ./tools/rehearsal/check.sh final-amd64 signed slot amd64
      - name: "FORK ONLY: check final-arm64"
        if: ${{ always() }}
        continue-on-error: true
        run: |
          ./tools/rehearsal/check.sh final-arm64 signed slot arm64
      - name: "FORK ONLY: the delayed signer's log"
        if: ${{ always() }}
        run: |
          cat "$RUNNER_TEMP/p3-sign.log" || :
      - name: Clean
        if: ${{ always() }}
        run: |
          make clean
          docker system prune -f -a --volumes
          rm -rf ~/.linuxkit

  # make test builds pillar and its dependencies, so wait for pkgs-amd64 to
  # push them; otherwise a package change is rebuilt here from source. Run
  # even if pkgs-amd64 failed, which may be after its push.
  coverage:
    if: github.event.repository.full_name == 'fork-only/coverage-off'
    needs: pkgs-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 1440
    steps:
      - name: Clear repository
        run: |
          sudo rm -fr "$GITHUB_WORKSPACE" && mkdir "$GITHUB_WORKSPACE"
          rm -fr ~/.linuxkit
          docker system prune --all --force --volumes
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Login to Docker Hub
        run: |
          docker login
      - name: Test
        run: |
          make test
      - name: Report test results as Annotations
        if: ${{ always() }}
        uses: guyarb/golang-test-annoations@96fc379b171c49932041d6c789e73331a7bdeec1  # v0.9.0
        with:
          test-results: dist/amd64/results.json
      - name: Store raw test results
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: 'test-report'
          path: ${{ github.workspace }}/dist
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Clean
        if: ${{ always() }}
        run: |
          make clean
          docker system prune -f -a --volumes
          rm -rf ~/.linuxkit

  # ════════════════════════════════════════════════════════════════════════
  # Stage 4, release tags only: one approval of the release environment
  # signs the images, indexes and release sums; then they are tagged and the
  # release is published.
  # ════════════════════════════════════════════════════════════════════════

  # Merge the per-arch descriptors each eve job pushed into the multi-arch
  # indexes, pushed by digest.
  indexes:
    if: ${{ (startsWith(github.ref, 'refs/tags/')) && (github.event.repository.full_name == 'eriknordmark/eve') }}
    needs: eve
    runs-on: ubuntu-24.04
    steps:
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
        with:
          version: 1.3.1
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: sign-images-eve-*
          path: eve
          merge-multiple: true
      - name: Push the multi-arch indexes
        run: |
          set -o pipefail
          rm -rf sign && mkdir sign
          : > sign/images.txt
          : > sign/tags.txt
          for dir in eve/index/*/*/; do
            dir=${dir%/}
            repo=docker.io/lfedge/$(basename "$(dirname "$dir")")
            jq -s '{schemaVersion: 2, mediaType: "application/vnd.oci.image.index.v1+json", manifests: add}' \
              "$dir"/*.json > index.json
            d=$(oras manifest push --descriptor "$repo" index.json | jq -r .digest)
            [[ "$d" == sha256:* ]] || { echo "::error::pushing the index for $dir failed"; exit 1; }
            echo "$repo@$d" >> sign/images.txt
            sed "s|^|$repo@$d |" "$dir/tags" >> sign/tags.txt
          done
          cat sign/tags.txt
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: sign-images-indexes
          path: sign

  # Builds the release files from the pushed digests into a draft release,
  # which only collaborators can see.
  trigger_assets:
    if: ${{ (startsWith(github.ref, 'refs/tags/')) && (github.event.repository.full_name == 'eriknordmark/eve') }}
    needs: [manifest, eve, indexes]
    permissions:
      contents: write
    uses: lf-edge/eve/.github/workflows/assets.yml@master  # zizmor: ignore[unpinned-uses] same-repo reusable workflow; @master is this repo's own head, which tagged release builds invoke
    secrets:
      DOCKERHUB_PULL_TOKEN: ${{ secrets.DOCKERHUB_PULL_TOKEN }}
      DOCKERHUB_PULL_USER: ${{ secrets.DOCKERHUB_PULL_USER }}
    with:
      tag_ref: ${{ github.ref_name }}
      draft: true

  sign:
    if: ${{ (startsWith(github.ref, 'refs/tags/')) && (github.event.repository.full_name == 'eriknordmark/eve') }}
    needs: [eve, indexes, trigger_assets]
    permissions:
      contents: read
      id-token: write
      issues: write
    uses: lf-edge/eve/.github/workflows/release-sign.yml@master  # zizmor: ignore[unpinned-uses] the signing identity is release-sign.yml at master
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
      registry-password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}

  tag:
    if: ${{ (startsWith(github.ref, 'refs/tags/')) && (github.event.repository.full_name == 'eriknordmark/eve') }}
    needs: sign
    runs-on: ubuntu-24.04
    steps:
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
        with:
          version: 1.3.1
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: sign-images-*
          path: sign
      - name: Tag the signed digests
        run: |
          find sign -name tags.txt -exec cat {} + | while read -r ref tag; do
            oras tag "$ref" "$tag"
          done

  release:
    if: ${{ (startsWith(github.ref, 'refs/tags/')) && (github.event.repository.full_name == 'eriknordmark/eve') }}
    needs: [trigger_assets, tag]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: signed-blobs
          path: bundles
      # The release stays a draft until a release signer approves it with
      # tools/eve-release-approval.sh, which publishes it.
      - name: Upload the bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.trigger_assets.outputs.release_id }}
          UPLOAD_URL: ${{ needs.trigger_assets.outputs.upload_url }}
        run: |
          [ -n "$RELEASE_ID" ] && [ -n "$UPLOAD_URL" ] || { echo "::error::no draft release"; exit 1; }
          for file in bundles/*.sigstore.json; do
            name=$(basename "$file")
            response=$(curl -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" -T "$file" "$UPLOAD_URL?name=$name")
            jq -e .id <<< "$response" > /dev/null || { echo "::error::uploading $name failed: $response"; exit 1; }
            echo "$name uploaded"
          done

  # Comments on the approval issue with the run's outcome and leaves it open:
  # release-approval.yml closes it once a release signer has approved the
  # release, and a re-run of the failed jobs reuses it, since it does not
  # re-run the job that opened it.
  close:
    if: ${{ always() && needs.sign.outputs.issue != '' }}
    needs: [sign, tag, release]
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Close or comment on the approval issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.sign.outputs.issue }}
          SIGN: ${{ needs.sign.result }}
          TAG: ${{ needs.tag.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          if [ "$RELEASE" = success ]; then
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body \
              "$run signed $GITHUB_REF_NAME. The release stays a draft until a release signer other than the tagger runs \`tools/eve-release-approval.sh approve $GITHUB_REF_NAME\`, as docs/SIGNING.md \"Approving a release\" describes."
          else
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body \
              "$run did not finish signing $GITHUB_REF_NAME (sign $SIGN, tag $TAG, release $RELEASE). Re-run the failed jobs, or reject the release as docs/SIGNING.md \"Rejecting a release\" describes."
          fi
