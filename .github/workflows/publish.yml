---
# FORK-ONLY rehearsal of the signed publish flow on eriknordmark/eve.
# Packages are pulled from docker.io/lfedge; their signatures live in the
# Docker Hub namespace vars.DOCKERHUB_SIGN_NAMESPACE (see sign-backfill.yml).
# EVE, eve-sources and one package rebuilt here are pushed there by digest.
# The build jobs hold no signing identity: they upload the pushed digests and
# the release files (to a draft release), release-sign.yml, called at the
# sign-master stand-in for master, signs all of them behind one approval, and
# only then are the digests tagged and the release published.
name: Publish
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - "[0-9]+.[0-9]+"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-lts"
      - "[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

permissions:
  contents: read

env:
  # The packages pulled from lfedge carry the backfill's signatures.
  EVE_COSIGN_IDENTITY_REGEXP: '^https://github\.com/eriknordmark/eve/\.github/workflows/(release-sign\.yml@refs/heads/sign-master|sign-backfill\.yml@refs/heads/cosign-signing)$'
  EVE_COSIGN_REPOSITORY: eriknordmark/eve
  EVE_COSIGN_ENFORCE: ${{ vars.EVE_COSIGN_ENFORCE }}
  EVE_SIG_PREFIX: docker.io/${{ vars.DOCKERHUB_SIGN_NAMESPACE }}
  FORK_REGISTRY: docker.io/${{ vars.DOCKERHUB_SIGN_NAMESPACE }}

jobs:
  pkgs:
    if: github.event.repository.full_name == 'eriknordmark/eve'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, os: ubuntu-24.04}
          - {arch: arm64, os: ubuntu-24.04-arm}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - name: Force fetch annotated tags (workaround)
        run: |
          git fetch --force --tags
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Build packages
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          SUCCESS=
          for i in 1 2 3; do
            echo "Run attempt: $i"
            if make -e V=1 HV=kvm ZARCH="$ARCH" PLATFORM=generic LINUXKIT_PKG_TARGET=build PRUNE=1 pkgs; then
              SUCCESS=true
              break
            else
              docker system prune -f -a --volumes
            fi
          done
          if [ -z "$SUCCESS" ]; then echo "::error::failed to build packages" && exit 1; fi
      - name: Verify package inputs
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ./tools/eve-cosign.sh classify "$RUNNER_TEMP/pkgs"
          ./tools/eve-cosign.sh verify "$RUNNER_TEMP/pkgs/pulled"
          ./tools/eve-cosign.sh verify-bases "$RUNNER_TEMP/pkgs/built" "$ARCH"
      - name: Require every package from the registry
        run: |
          if [ -s "$RUNNER_TEMP/pkgs/built" ]; then
            echo "::error::the fork cannot push or sign packages; built here:"
            cat "$RUNNER_TEMP/pkgs/built"
            exit 1
          fi
      - name: Post package report
        if: ${{ always() }}
        run: |
          df -h /
          docker system df

  eve:
    if: github.event.repository.full_name == 'eriknordmark/eve'
    needs: pkgs
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, hv: kvm, platform: generic, os: ubuntu-24.04}
          - {arch: arm64, hv: kvm, platform: generic, os: ubuntu-24.04-arm}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Build remaining packages
        uses: ./.github/actions/run-make
        with:
          command: "V=1 HV=${{ matrix.hv }} ZARCH=${{ matrix.arch }} PLATFORM=${{ matrix.platform }} LINUXKIT_PKG_TARGET=build PRUNE=1 pkgs"
          dockerhub-token: ""
          dockerhub-account: ""
          clean: false
      - name: Verify package inputs
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ./tools/eve-cosign.sh classify "$RUNNER_TEMP/pkgs"
          ./tools/eve-cosign.sh verify "$RUNNER_TEMP/pkgs/pulled"
          ./tools/eve-cosign.sh verify-bases "$RUNNER_TEMP/pkgs/built" "$ARCH" "$(docker version -f '{{.Server.Arch}}')"
      # LINUXKIT_PKG_TARGET=push on a tag pushes every cached package to
      # lfedge, so the fork builds into docker and pushes EVE itself.
      - name: Build EVE
        uses: ./.github/actions/run-make
        with:
          command: "V=1 HV=${{ matrix.hv }} ZARCH=${{ matrix.arch }} PLATFORM=${{ matrix.platform }} LINUXKIT_PKG_TARGET=build eve"
          dockerhub-token: ""
          dockerhub-account: ""
          clean: false
      - name: Verify EVE inputs
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ./tools/eve-cosign.sh classify "$RUNNER_TEMP/eve"
          ./tools/eve-cosign.sh verify "$RUNNER_TEMP/eve/pulled"
          ./tools/eve-cosign.sh verify-bases "$RUNNER_TEMP/eve/built" "$ARCH" "$(docker version -f '{{.Server.Arch}}')"
          if [ -s "$RUNNER_TEMP/eve/built" ]; then
            echo "::error::the fork cannot push or sign packages; built here:"
            cat "$RUNNER_TEMP/eve/built"
            exit 1
          fi
      # Logging in only here keeps the build's pulls off the account's hourly
      # pull quota.
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
        with:
          version: 1.3.1
      # Everything is pushed by digest from the linuxkit cache, so the
      # registry gets the bytes linuxkit would push, and nothing is tagged
      # until release-sign.yml has signed it (the tag job).
      #   push <repo> <cache ref>   push the platform manifest of <cache ref>
      #                             and its attestation manifests; print the
      #                             platform manifest's digest
      #   want <repo@digest> <tag>  list it for signing and for tagging
      - name: Prepare the push helpers
        run: |
          mkdir -p sign/sbom
          : > sign/images.txt
          : > sign/tags.txt
          cat > "$RUNNER_TEMP/push" << 'EOF'
          cache=$HOME/.linuxkit/cache
          push() {
            local d raw plat att
            d=$(jq -r --arg r "docker.io/$2" '.manifests[]
              | select(.annotations["org.opencontainers.image.ref.name"] == $r) | .digest' "$cache/index.json")
            [ -n "$d" ] || { echo "::error::$2 is not in the linuxkit cache" >&2; return 1; }
            raw=$(cat "$cache/blobs/sha256/${d#sha256:}")
            case "$(jq -r .mediaType <<< "$raw")" in
            *index*)
              plat=$(jq -r --arg a "$ARCH" '.manifests[] | select(.platform.architecture == $a) | .digest' <<< "$raw")
              for att in $(jq -r '.manifests[]
                  | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | .digest' <<< "$raw"); do
                oras cp --from-oci-layout "$cache@$att" "$1" >&2
              done
              # The per-arch descriptors, for the multi-arch index.
              jq '.manifests' <<< "$raw" > "sign/descriptors-${1##*/}-$ARCH.json"
              ;;
            *) plat=$d ;;
            esac
            [ -n "$plat" ] || { echo "::error::no linux/$ARCH manifest in $2" >&2; return 1; }
            oras cp --from-oci-layout "$cache@$plat" "$1" >&2
            echo "$plat"
          }
          want() { echo "$1" >> sign/images.txt; echo "$1 $2" >> sign/tags.txt; }
          EOF
      # Upstream pushes each package it builds to lfedge; the fork rehearses
      # that with one package pushed to its own namespace.
      - name: Push a package built here
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          . "$RUNNER_TEMP/push"
          build-tools/bin/linuxkit pkg build --force --platforms "linux/$ARCH" pkg/mkconf
          ref=$(build-tools/bin/linuxkit pkg show-tag pkg/mkconf)
          d=$(push "$FORK_REGISTRY/eve-mkconf" "$ref-$ARCH")
          want "$FORK_REGISTRY/eve-mkconf@$d" "${ref##*:}-rehearsal-${GITHUB_REF_NAME}-${ARCH}"
      - name: Collect SBOM and sources
        uses: ./.github/actions/run-make
        with:
          command: "V=1 HV=${{ matrix.hv }} ZARCH=${{ matrix.arch }} PLATFORM=${{ matrix.platform }} LINUXKIT_PKG_TARGET=build sbom collected_sources compare_sbom_collected_sources publish_sources"
          dockerhub-token: ""
          dockerhub-account: ""
          clean: false
      - name: Push EVE and sources to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ARCH: ${{ matrix.arch }}
          MAKE_VARS: "HV=${{ matrix.hv }} ZARCH=${{ matrix.arch }} PLATFORM=${{ matrix.platform }}"
          HV: ${{ matrix.hv }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # shellcheck disable=SC2086
          VER=$(make -s $MAKE_VARS version | tail -1)
          # shellcheck disable=SC2086
          REL=$(make -s $MAKE_VARS LINUXKIT_PKG_TARGET=push eve_rel_info | tail -1)
          [ -n "$REL" ] || { echo "::error::no release name"; exit 1; }
          . "$RUNNER_TEMP/push"
          eve=$(push "$FORK_REGISTRY/eve" "lfedge/eve:$VER-$HV-$ARCH")
          sources=$(push "$FORK_REGISTRY/eve-sources" "lfedge/eve-sources:$VER-$HV-$ARCH")
          want "$FORK_REGISTRY/eve@$eve" "$REL-$HV-$ARCH"
          [ "$HV" != kvm ] || echo "$FORK_REGISTRY/eve@$eve $REL-$ARCH" >> sign/tags.txt
          want "$FORK_REGISTRY/eve-sources@$sources" "$REL-$HV-$ARCH"
          # shellcheck disable=SC2086
          cp "$(make -s $MAKE_VARS sbom_info | tail -1)" "sign/sbom/${eve#sha256:}.spdx.json"
          # What assets.yml builds the release files from.
          printf 'EVE=%s\nEVE_SOURCES=%s\n' "$FORK_REGISTRY/eve@$eve" "$FORK_REGISTRY/eve-sources@$sources" \
            > "sign/release-$ARCH-$HV-$PLATFORM.env"
          # No tag may point at the pushed digest yet.
          curl -fsS "https://hub.docker.com/v2/repositories/${FORK_REGISTRY#docker.io/}/eve/tags?page_size=100" |
            jq -r '.results[] | "\(.name) \(.digest) \([.images[]?.digest] | join(","))"' > "$RUNNER_TEMP/tags-now"
          if grep "$eve" "$RUNNER_TEMP/tags-now"; then
            echo "::error::a tag already points at $eve"
            exit 1
          fi
          cat sign/tags.txt
      - name: Upload the list of pushed images
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: sign-images-eve-${{ matrix.arch }}-${{ matrix.hv }}-${{ matrix.platform }}
          path: sign
      - name: Post EVE report
        if: ${{ always() }}
        run: |
          df -h /
          docker system df

  # Upstream, linuxkit merges the per-arch pushes into this index; the fork
  # merges the per-arch descriptors from the linuxkit cache and pushes the
  # index by digest.
  indexes:
    if: github.event.repository.full_name == 'eriknordmark/eve' && startsWith(github.ref, 'refs/tags/')
    needs: eve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
        with:
          version: 1.3.1
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: sign-images-eve-*
          path: eve
          merge-multiple: true
      - name: Create the release index
        run: |
          mkdir sign
          find eve -name 'descriptors-eve-*.json' ! -name 'descriptors-eve-sources-*' | sort | xargs jq -s \
            '{schemaVersion: 2, mediaType: "application/vnd.oci.image.index.v1+json", manifests: add}' > index.json
          jq -c '.manifests[] | {digest, platform, annotations}' index.json
          d=$(oras manifest push --descriptor "$FORK_REGISTRY/eve" index.json | jq -r .digest)
          echo "$FORK_REGISTRY/eve@$d" > sign/images.txt
          printf '%s %s\n' "$FORK_REGISTRY/eve@$d" "$GITHUB_REF_NAME" "$FORK_REGISTRY/eve@$d" "$GITHUB_REF_NAME-kvm" \
            > sign/tags.txt
          cat sign/tags.txt
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: sign-images-indexes
          path: sign

  # The release files are built from the pushed digests into a draft release,
  # which only collaborators can see.
  trigger_assets:
    if: github.event.repository.full_name == 'eriknordmark/eve' && startsWith(github.ref, 'refs/tags/')
    needs: [eve, indexes]
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/assets.yml
    secrets: inherit  # zizmor: ignore[secrets-inherit] fork-only
    with:
      tag_ref: ${{ github.ref_name }}

  # One call signs the images, indexes and release sums of a tag, behind one
  # approval of the release environment.
  sign:
    if: >-
      github.event.repository.full_name == 'eriknordmark/eve' && !cancelled()
      && needs.eve.result == 'success' && needs.indexes.result != 'failure'
      && needs.trigger_assets.result != 'failure'
    needs: [eve, indexes, trigger_assets]
    permissions:
      contents: read
      id-token: write
    uses: eriknordmark/eve/.github/workflows/release-sign.yml@sign-master
    with:
      blobs: ${{ startsWith(github.ref, 'refs/tags/') && 'sign-blobs-*' || '' }}
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
      registry-password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}

  tag:
    if: github.event.repository.full_name == 'eriknordmark/eve' && !cancelled() && needs.sign.result == 'success'
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
        with:
          version: 1.3.1
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: sign-images-*
          path: sign
      - name: Tag the signed digests
        run: |
          find sign -name tags.txt -exec cat {} + | while read -r ref tag; do
            oras tag "$ref" "$tag"
          done

  release:
    if: >-
      github.event.repository.full_name == 'eriknordmark/eve' && startsWith(github.ref, 'refs/tags/')
      && !cancelled() && needs.tag.result == 'success'
    needs: [trigger_assets, tag]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: signed-blobs
          path: bundles
      - name: Upload the bundles and publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.trigger_assets.outputs.release_id }}
          UPLOAD_URL: ${{ needs.trigger_assets.outputs.upload_url }}
        run: |
          [ -n "$RELEASE_ID" ] && [ -n "$UPLOAD_URL" ] || { echo "::error::no draft release"; exit 1; }
          for file in bundles/*.sigstore.json; do
            name=$(basename "$file")
            response=$(curl -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" -T "$file" "$UPLOAD_URL?name=$name")
            jq -e .id <<< "$response" > /dev/null || { echo "::error::uploading $name failed: $response"; exit 1; }
            echo "$name uploaded"
          done
          response=$(curl -sS -X PATCH -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d '{"draft": false, "prerelease": true}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          jq -e '.draft == false' <<< "$response" > /dev/null || { echo "::error::publishing failed: $response"; exit 1; }
          jq -r .html_url <<< "$response"
