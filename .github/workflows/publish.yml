---
# FORK-ONLY rehearsal of the signed publish flow on eriknordmark/eve.
# Packages are pulled from docker.io/lfedge; their signatures live in the
# Docker Hub namespace vars.DOCKERHUB_SIGN_NAMESPACE (see sign-backfill.yml).
# EVE, eve-sources and one package rebuilt here are pushed there. The build
# jobs hold no signing identity: they upload the pushed digests, and
# release-sign.yml, called at the sign-master stand-in for master, signs them.
name: Publish
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - "[0-9]+.[0-9]+"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-lts"
      - "[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

permissions:
  contents: read

env:
  # The packages pulled from lfedge carry the backfill's signatures.
  EVE_COSIGN_IDENTITY_REGEXP: '^https://github\.com/eriknordmark/eve/\.github/workflows/(release-sign\.yml@refs/heads/sign-master|sign-backfill\.yml@refs/heads/cosign-signing)$'
  EVE_COSIGN_REPOSITORY: eriknordmark/eve
  EVE_COSIGN_ENFORCE: ${{ vars.EVE_COSIGN_ENFORCE }}
  EVE_SIG_PREFIX: docker.io/${{ vars.DOCKERHUB_SIGN_NAMESPACE }}
  FORK_REGISTRY: docker.io/${{ vars.DOCKERHUB_SIGN_NAMESPACE }}

jobs:
  pkgs:
    if: github.event.repository.full_name == 'eriknordmark/eve'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, os: ubuntu-24.04}
          - {arch: arm64, os: ubuntu-24.04-arm}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - name: Force fetch annotated tags (workaround)
        run: |
          git fetch --force --tags
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Build packages
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          SUCCESS=
          for i in 1 2 3; do
            echo "Run attempt: $i"
            if make -e V=1 HV=kvm ZARCH="$ARCH" PLATFORM=generic LINUXKIT_PKG_TARGET=build PRUNE=1 pkgs; then
              SUCCESS=true
              break
            else
              docker system prune -f -a --volumes
            fi
          done
          if [ -z "$SUCCESS" ]; then echo "::error::failed to build packages" && exit 1; fi
      - name: Verify package inputs
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ./tools/eve-cosign.sh classify "$RUNNER_TEMP/pkgs"
          ./tools/eve-cosign.sh verify "$RUNNER_TEMP/pkgs/pulled"
          ./tools/eve-cosign.sh verify-bases "$RUNNER_TEMP/pkgs/built" "$ARCH"
      - name: Require every package from the registry
        run: |
          if [ -s "$RUNNER_TEMP/pkgs/built" ]; then
            echo "::error::the fork cannot push or sign packages; built here:"
            cat "$RUNNER_TEMP/pkgs/built"
            exit 1
          fi
      - name: Post package report
        if: ${{ always() }}
        run: |
          df -h /
          docker system df

  eve:
    if: github.event.repository.full_name == 'eriknordmark/eve'
    needs: pkgs
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, hv: kvm, platform: generic, os: ubuntu-24.04}
          - {arch: arm64, hv: kvm, platform: generic, os: ubuntu-24.04-arm}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Build remaining packages
        uses: ./.github/actions/run-make
        with:
          command: "V=1 HV=${{ matrix.hv }} ZARCH=${{ matrix.arch }} PLATFORM=${{ matrix.platform }} LINUXKIT_PKG_TARGET=build PRUNE=1 pkgs"
          dockerhub-token: ""
          dockerhub-account: ""
          clean: false
      - name: Verify package inputs
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ./tools/eve-cosign.sh classify "$RUNNER_TEMP/pkgs"
          ./tools/eve-cosign.sh verify "$RUNNER_TEMP/pkgs/pulled"
          ./tools/eve-cosign.sh verify-bases "$RUNNER_TEMP/pkgs/built" "$ARCH" "$(docker version -f '{{.Server.Arch}}')"
      # LINUXKIT_PKG_TARGET=push on a tag pushes every cached package to
      # lfedge, so the fork builds into docker and pushes EVE itself.
      - name: Build EVE
        uses: ./.github/actions/run-make
        with:
          command: "V=1 HV=${{ matrix.hv }} ZARCH=${{ matrix.arch }} PLATFORM=${{ matrix.platform }} LINUXKIT_PKG_TARGET=build eve"
          dockerhub-token: ""
          dockerhub-account: ""
          clean: false
      - name: Verify EVE inputs
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ./tools/eve-cosign.sh classify "$RUNNER_TEMP/eve"
          ./tools/eve-cosign.sh verify "$RUNNER_TEMP/eve/pulled"
          ./tools/eve-cosign.sh verify-bases "$RUNNER_TEMP/eve/built" "$ARCH" "$(docker version -f '{{.Server.Arch}}')"
          if [ -s "$RUNNER_TEMP/eve/built" ]; then
            echo "::error::the fork cannot push or sign packages; built here:"
            cat "$RUNNER_TEMP/eve/built"
            exit 1
          fi
      # Logging in only here keeps the build's pulls off the account's hourly
      # pull quota.
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
      # record <repo> <digest>: list the digest for release-sign.yml, and the
      # platform manifests in it when it is an index.
      - name: Prepare the list of pushed images
        run: |
          mkdir -p sign/sbom
          : > sign/images.txt
          cat > "$RUNNER_TEMP/record" << 'EOF'
          record() {
            local raw
            echo "$1@$2" >> sign/images.txt
            raw=$(docker buildx imagetools inspect --raw "$1@$2")
            case "$(jq -r .mediaType <<< "$raw")" in
            *index*|*manifest.list*)
              jq -r --arg r "$1" '.manifests[]
                | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
                | "\($r)@\(.digest)"' <<< "$raw" >> sign/images.txt
              ;;
            esac
          }
          EOF
      # Upstream pushes each package it builds to lfedge; the fork rehearses
      # that with one package pushed to its own namespace.
      - name: Push a package built here
        env:
          ARCH: ${{ matrix.arch }}
          NS: ${{ vars.DOCKERHUB_SIGN_NAMESPACE }}
        run: |
          . "$RUNNER_TEMP/record"
          lk=build-tools/bin/linuxkit
          tag="{{.Hash}}-rehearsal-${GITHUB_REF_NAME}-${ARCH}"
          "$lk" pkg push --force --org "$NS" --tag "$tag" --platforms "linux/$ARCH" pkg/mkconf
          ref=docker.io/$("$lk" pkg show-tag --org "$NS" --tag "$tag" pkg/mkconf)
          record "${ref%:*}" "$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$ref" | jq -r .digest)"
      - name: Collect SBOM and sources
        uses: ./.github/actions/run-make
        with:
          command: "V=1 HV=${{ matrix.hv }} ZARCH=${{ matrix.arch }} PLATFORM=${{ matrix.platform }} LINUXKIT_PKG_TARGET=build sbom collected_sources compare_sbom_collected_sources publish_sources"
          dockerhub-token: ""
          dockerhub-account: ""
          clean: false
      - name: Push EVE and sources to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ARCH: ${{ matrix.arch }}
          MAKE_VARS: "HV=${{ matrix.hv }} ZARCH=${{ matrix.arch }} PLATFORM=${{ matrix.platform }}"
          HV: ${{ matrix.hv }}
        run: |
          # shellcheck disable=SC2086
          VER=$(make -s $MAKE_VARS version | tail -1)
          # shellcheck disable=SC2086
          REL=$(make -s $MAKE_VARS LINUXKIT_PKG_TARGET=push eve_rel_info | tail -1)
          [ -n "$REL" ] || { echo "::error::no release name"; exit 1; }
          . "$RUNNER_TEMP/record"
          # push <image> <tag>: print the digest the registry stored.
          push() {
            docker tag "$1" "$2"
            docker push "$2" | tee /dev/stderr | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | tail -1
          }
          eve=$(push "lfedge/eve:$VER-$HV-$ARCH" "$FORK_REGISTRY/eve:$REL-$HV-$ARCH")
          if [ "$HV" = kvm ]; then
            [ "$(push "lfedge/eve:$VER-$HV-$ARCH" "$FORK_REGISTRY/eve:$REL-$ARCH")" = "$eve" ] ||
              { echo "::error::$REL-$ARCH and $REL-$HV-$ARCH differ"; exit 1; }
          fi
          sources=$(push "lfedge/eve-sources:$VER-$HV-$ARCH" "$FORK_REGISTRY/eve-sources:$REL-$HV-$ARCH")
          [ -n "$eve" ] && [ -n "$sources" ] || { echo "::error::no digest from docker push"; exit 1; }
          record "$FORK_REGISTRY/eve" "$eve"
          record "$FORK_REGISTRY/eve-sources" "$sources"
          # shellcheck disable=SC2086
          cp "$(make -s $MAKE_VARS sbom_info | tail -1)" "sign/sbom/${eve#sha256:}.spdx.json"
      - name: Upload the list of pushed images
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: sign-images-eve-${{ matrix.arch }}-${{ matrix.hv }}-${{ matrix.platform }}
          path: sign
      - name: Post EVE report
        if: ${{ always() }}
        run: |
          df -h /
          docker system df

  # Upstream, linuxkit merges the per-arch pushes into these indexes; the fork
  # creates them here.
  indexes:
    if: github.event.repository.full_name == 'eriknordmark/eve' && startsWith(github.ref, 'refs/tags/')
    needs: eve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}
      - name: Create release indexes
        run: |
          mkdir sign
          for suffix in "" -kvm; do
            ref="$FORK_REGISTRY/eve:${GITHUB_REF_NAME}${suffix}"
            docker buildx imagetools create -t "$ref" "$ref-amd64" "$ref-arm64"
            echo "$FORK_REGISTRY/eve@$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$ref" | jq -r .digest)" >> sign/images.txt
          done
          cat sign/images.txt
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: sign-images-indexes
          path: sign

  sign:
    if: >-
      github.event.repository.full_name == 'eriknordmark/eve' && !cancelled()
      && needs.eve.result == 'success' && needs.indexes.result != 'failure'
    needs: [eve, indexes]
    permissions:
      contents: read
      id-token: write
    uses: eriknordmark/eve/.github/workflows/release-sign.yml@sign-master
    with:
      blobs: ""
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_SIGN_ACCOUNT }}
      registry-password: ${{ secrets.DOCKERHUB_SIGN_TOKEN }}

  trigger_assets:
    if: github.event.repository.full_name == 'eriknordmark/eve' && startsWith(github.ref, 'refs/tags/')
    needs: sign
    permissions:
      contents: write
      packages: read
      id-token: write
    uses: ./.github/workflows/assets.yml
    secrets: inherit  # zizmor: ignore[secrets-inherit] fork-only
    with:
      tag_ref: ${{ github.ref_name }}
